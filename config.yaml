tile_size: 1024

# Local background / noise estimation
background_cell_px: 128
noise_floor: 0.288675

# Candidate detection
detection_smoothing_sigma_px: 1.0
seed_sigma: 5.0
grow_sigma: 2.5
minimum_area_px: 6
minimum_peak_snr: 3.0

# Streak classification
streak:
  elongation_min: 2.5
  major_axis_min_px: 12.0
  eccentricity_min: 0.85

# Candidates that should be checked manually
review:
  ambiguous_elongation_min: 1.6
  faint_peak_snr: 7.0
  large_area_px: 400

classes:
  0: star_blob
  1: streak_object
